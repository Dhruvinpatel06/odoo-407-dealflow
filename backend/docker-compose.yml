services:
  postgres:
    image: postgres:16-alpine
    container_name: dealflow360-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: dealflow360
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow@360

    ports:
      - "5432:5432"

    volumes:
      - dealflow360_postgres_data:/var/lib/postgresql/data

volumes:
  dealflow360_postgres_data: